name: Build and test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install Python dependencies
      run: pip install setuptools
    - name: Install project
      run: yarn install
    - name: Build
      run: |
        bash ./scripts/prepare.sh
